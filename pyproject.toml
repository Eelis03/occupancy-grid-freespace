[project]
name = "occupancy-grid-freespace"
version = "0.1.0"
description = "Bird's-eye-view free space estimation from simulated lidar using an inverse sensor model."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Emre Yilmaz" }]
keywords = ["autonomous-driving", "occupancy-grid", "lidar", "mapping", "python"]
dependencies = ["numpy>=2.0", "scipy>=1.14", "matplotlib>=3.9"]

[dependency-groups]
dev = ["pytest>=8.3", "pytest-cov>=6.0", "ruff>=0.8", "mypy>=1.13"]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-cov>=6.0", "ruff>=0.8", "mypy>=1.13"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/freespace_grid"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: excluded from the default run"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/freespace_grid"]

# scipy ships no type information and the separate scipy-stubs distribution is not a
# declared dependency of this project, so the two functions imported from it are
# untyped at the boundary. Everything the project itself defines stays strictly typed.
[[tool.mypy.overrides]]
module = ["scipy.*"]
ignore_missing_imports = true
