name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Python 3.12 on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras --dev

      # The floor is the measured statement coverage rounded down and reduced by two,
      # which leaves room for a platform difference without leaving room for a module
      # to stop being tested. The figure module reports zero here on purpose: it is
      # exercised only through the example scripts, which run as subprocesses.
      - name: Run tests
        run: >
          uv run pytest -q
          --cov=src/freespace_grid
          --cov-report=term-missing
          --cov-fail-under=86

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run mypy
